<!-- ==========================================================================
     OpenClaw Chat Widget
     --------------------------------------------------------------------------
     Paste this whole block into your website, just before the closing </body>.
     Change ONE thing: set PROXY_URL below to your deployed proxy's address.
     It talks ONLY to your proxy, never to the gateway. No secrets here.
     ========================================================================== -->
<div id="oc-chat-root"></div>
<script>
(function () {
  // ---- CONFIG: change this to your deployed proxy URL -----------------------
  var PROXY_URL = "https://YOUR-PROXY-URL-HERE/chat";   // e.g. https://my-proxy.up.railway.app/chat
  var BOT_NAME  = "Supanova Concierge";
  var WELCOME   = "Hi! How can I help you today?";
  // ---------------------------------------------------------------------------

  // Persist a per-visitor id so a returning visitor keeps their own thread.
  var visitorId = localStorage.getItem("oc_visitor_id");
  if (!visitorId) {
    visitorId = "v" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem("oc_visitor_id", visitorId);
  }

  var css = ''
    + '#oc-bubble{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;'
    + 'background:#e0533d;color:#fff;border:none;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);'
    + 'display:flex;align-items:center;justify-content:center;z-index:99999;transition:transform .15s;}'
    + '#oc-bubble:hover{transform:scale(1.06);}'
    + '#oc-bubble svg{width:28px;height:28px;}'
    + '#oc-panel{position:fixed;bottom:90px;right:20px;width:360px;max-width:calc(100vw - 32px);'
    + 'height:520px;max-height:calc(100vh - 120px);background:#fff;border-radius:16px;'
    + 'box-shadow:0 12px 40px rgba(0,0,0,.28);display:none;flex-direction:column;overflow:hidden;'
    + 'z-index:99999;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}'
    + '#oc-panel.open{display:flex;}'
    + '#oc-head{background:#e0533d;color:#fff;padding:14px 16px;font-weight:600;font-size:15px;'
    + 'display:flex;align-items:center;justify-content:space-between;}'
    + '#oc-head button{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1;}'
    + '#oc-msgs{flex:1;overflow-y:auto;padding:14px;background:#f7f7f8;}'
    + '.oc-row{margin-bottom:10px;display:flex;}'
    + '.oc-row.user{justify-content:flex-end;}'
    + '.oc-msg{max-width:80%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.4;'
    + 'white-space:pre-wrap;word-wrap:break-word;}'
    + '.oc-row.bot .oc-msg{background:#fff;color:#1a1a1a;border:1px solid #ececec;border-bottom-left-radius:4px;}'
    + '.oc-row.user .oc-msg{background:#e0533d;color:#fff;border-bottom-right-radius:4px;}'
    + '.oc-typing{font-size:13px;color:#888;padding:2px 4px;}'
    + '#oc-input{display:flex;border-top:1px solid #ececec;padding:10px;gap:8px;background:#fff;}'
    + '#oc-text{flex:1;border:1px solid #ddd;border-radius:20px;padding:9px 14px;font-size:14px;outline:none;}'
    + '#oc-text:focus{border-color:#e0533d;}'
    + '#oc-send{background:#e0533d;color:#fff;border:none;border-radius:20px;padding:0 16px;cursor:pointer;font-size:14px;}'
    + '#oc-send:disabled{opacity:.5;cursor:default;}';

  var style = document.createElement("style");
  style.textContent = css;
  document.head.appendChild(style);

  var root = document.getElementById("oc-chat-root");
  root.innerHTML = ''
    + '<button id="oc-bubble" aria-label="Open chat">'
    +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
    +     '<path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.6-.8L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/>'
    +   '</svg>'
    + '</button>'
    + '<div id="oc-panel" role="dialog" aria-label="Chat">'
    +   '<div id="oc-head"><span>' + BOT_NAME + '</span><button id="oc-close" aria-label="Close">\u00d7</button></div>'
    +   '<div id="oc-msgs"></div>'
    +   '<div id="oc-input">'
    +     '<input id="oc-text" type="text" placeholder="Type a message..." autocomplete="off"/>'
    +     '<button id="oc-send">Send</button>'
    +   '</div>'
    + '</div>';

  var bubble = document.getElementById("oc-bubble");
  var panel  = document.getElementById("oc-panel");
  var closeB = document.getElementById("oc-close");
  var msgs   = document.getElementById("oc-msgs");
  var text   = document.getElementById("oc-text");
  var sendB  = document.getElementById("oc-send");
  var greeted = false;

  function addMsg(who, content) {
    var row = document.createElement("div");
    row.className = "oc-row " + who;
    var b = document.createElement("div");
    b.className = "oc-msg";
    b.textContent = content;
    row.appendChild(b);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
    return row;
  }

  function openPanel() {
    panel.classList.add("open");
    if (!greeted) { addMsg("bot", WELCOME); greeted = true; }
    text.focus();
  }
  function closePanel() { panel.classList.remove("open"); }

  bubble.addEventListener("click", function () {
    panel.classList.contains("open") ? closePanel() : openPanel();
  });
  closeB.addEventListener("click", closePanel);

  function send() {
    var m = text.value.trim();
    if (!m) return;
    addMsg("user", m);
    text.value = "";
    sendB.disabled = true;

    var typing = document.createElement("div");
    typing.className = "oc-typing";
    typing.textContent = BOT_NAME + " is typing...";
    msgs.appendChild(typing);
    msgs.scrollTop = msgs.scrollHeight;

    fetch(PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: m, visitorId: visitorId }),
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        typing.remove();
        if (data && data.reply) addMsg("bot", data.reply);
        else addMsg("bot", (data && data.error) || "Sorry, something went wrong.");
      })
      .catch(function () {
        typing.remove();
        addMsg("bot", "Sorry, I couldn't reach the server. Please try again.");
      })
      .finally(function () {
        sendB.disabled = false;
        text.focus();
      });
  }

  sendB.addEventListener("click", send);
  text.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); send(); }
  });
})();
</script>
